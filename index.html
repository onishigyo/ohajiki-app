<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- user-scalable=no は iOS Safari が無視する（アクセシビリティ）。
         ダブルタップ拡大は CSS の touch-action で止める（#37）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#fef6ee" />
    <title>おはじき銀行</title>

    <!-- PWA（ホーム画面に追加してアプリのように使う・#18）。
         manifest とアイコンは public/ に置き vite が dist/ 直下へコピーする。 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="おはじき" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app" id="app">
      <div class="top">
        <h1>おはじき銀行</h1>
        <button class="gear" id="gearBtn" aria-label="設定">⚙️</button>
      </div>

      <div class="child-tabs">
        <button class="child-tab active" data-child-tab="today">今日</button>
        <button class="child-tab" data-child-tab="history">これまで</button>
      </div>

      <!-- 今日 -->
      <div id="childToday">
        <!-- 今日の残高カード -->
        <div class="today-card" id="todayCard">
          <div class="today-label">今日 もらえる おはじき<span class="today-more">›</span></div>
          <div class="today-count">
            <span class="num" id="todayNum">0</span>
            <span class="unit">こ</span>
          </div>
          <div class="today-sub" id="todaySub"></div>
          <div class="beads-row" id="beadsRow"></div>
        </div>

        <!-- やること -->
        <div class="sec-title"><span class="dot"></span>今日 何を がんばった？</div>
        <div class="actions" id="actionsGrid"></div>
      </div>

      <!-- これまで もらった おはじき -->
      <div id="childHistory" hidden>
        <div class="history-total">これまで <b id="childHistoryTotal">0</b> こ もらったよ</div>
        <div class="chart" id="childHistoryChart"></div>
      </div>
    </div>

    <!-- 子ども:確認シート -->
    <div class="overlay" id="confirmOverlay">
      <div class="sheet">
        <div class="confirm-card">
          <div class="confirm-emoji" id="cEmoji">📚</div>
          <div class="confirm-name" id="cName">どくしょ</div>
          <div class="confirm-reward"><b id="cReward">2</b>こ もらえる</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="confirmCancel">やめる</button>
            <button class="btn btn-primary" id="confirmSubmit">できた！</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 子ども:時間シート（timed ルール）-->
    <div class="overlay" id="timedOverlay">
      <div class="sheet">
        <div class="confirm-card">
          <div class="confirm-emoji" id="tEmoji">📚</div>
          <div class="confirm-name" id="tName">どくしょ</div>
          <div class="timed-hint" id="tHint">15分 できたら ＋15分 を 押してね</div>
          <div class="timed-readout">
            <span class="timed-count"><b id="tMinutes">0</b>分</span>
            <span class="timed-arrow">→</span>
            <span class="timed-get"><b id="tReward">0</b>こ</span>
          </div>
          <div class="timed-steppers">
            <button class="stepper" id="tMinus" aria-label="15分 へらす">−</button>
            <span class="timed-taps"><b id="tTaps">0</b>回</span>
            <button class="stepper" id="tPlus" aria-label="15分 ふやす">＋15分</button>
          </div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="timedCancel">やめる</button>
            <button class="btn btn-primary" id="timedSubmit">できた！</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 子ども:今日の内訳（残高カードをタップ）-->
    <div class="overlay" id="detailOverlay">
      <div class="sheet">
        <div class="detail-head">
          <span>きょう やったこと</span>
          <span class="detail-total"><b id="detailTotal">0</b>こ</span>
        </div>
        <div id="detailList"></div>
        <div class="btn-row">
          <button class="btn btn-ghost" id="detailClose">とじる</button>
        </div>
      </div>
    </div>

    <!-- 親:はい/やめる 確認ダイアログ -->
    <div class="overlay" id="askOverlay">
      <div class="sheet">
        <div class="confirm-card">
          <div class="confirm-name" id="askText">…</div>
          <div class="btn-row">
            <button class="btn btn-ghost" id="askCancel">やめる</button>
            <button class="btn btn-primary" id="askOk">はい</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 親:PINロック -->
    <div class="overlay" id="pinOverlay">
      <div class="sheet">
        <div class="parent-lock">
          <h2>おうちの人へ</h2>
          <div class="sheet-sub">あんしょうばんごうを 入れてね（さいしょは 0000）</div>
          <div class="pin-dots" id="pinDots"></div>
          <div class="keypad" id="keypad"></div>
        </div>
      </div>
    </div>

    <!-- 親:管理画面 -->
    <div class="overlay" id="parentOverlay">
      <div class="sheet">
        <div class="parent-tabs">
          <button class="ptab active" data-ptab="today">今日の集計</button>
          <button class="ptab" data-ptab="settings">設定</button>
        </div>

        <div class="parent-scroll">
          <div id="ptab-today"></div>
          <div id="ptab-settings" style="display: none"></div>
        </div>

        <div class="save-bar">
          <button class="full-btn" id="parentClose">閉じる</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- 翌日はじめて開いたとき：うさぎが昨日のことを言う。タップで通常画面へ（#51）-->
    <div class="greeting" id="greeting" hidden aria-hidden="true">
      <div class="greeting-figure">
        <img class="greeting-img" id="greetingImg" alt="うさぎ" />
      </div>
      <div class="greeting-line" id="greetingLine"></div>
      <div class="greeting-tap">タッチ してね</div>
    </div>

    <!-- タップで「＋◯こ」演出（#14 / #48）-->
    <div class="celebrate" id="celebrate" hidden aria-hidden="true">
      <div class="celebrate-card">
        <div class="celebrate-burst" id="celebrateBurst"></div>
        <div class="celebrate-plus" id="celebratePlus">＋0こ</div>
        <div class="celebrate-items" id="celebrateItems"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
